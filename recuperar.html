<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha | EAD UX</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="assets/js/pwa-register.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o formulário</a>
  <main id="conteudo" class="login-page" tabindex="-1">
    <div class="login-card">
      <div class="login-logo">
        <span class="badge">EAD UX</span>
        <h1>Recuperar senha</h1>
        <p>Simulação: nenhum e-mail real é enviado</p>
      </div>
      <div id="alert" class="alert" tabindex="-1"></div>
      <form id="recuperarForm" novalidate>
        <div class="form-group">
          <label for="email">E-mail cadastrado</label>
          <span class="form-hint" id="emailHint">Você receberá um link para criar uma nova senha.</span>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" autocomplete="email" autocapitalize="none" spellcheck="false" aria-describedby="emailHint emailError">
          <span class="form-error" id="emailError"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar link de recuperação</button>
      </form>
      <div class="login-links" style="justify-content:center;">
        <a href="index.html">Voltar ao login</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="assets/Apostila_Experiencia_do_Usuario.pdf" download="Apostila_Experiência_do_Usuário.pdf">Baseado na Apostila da Proz Educação</a></p>
      <p>Ambiente EAD de Experiência do Usuário, <span id="yearNow">2026</span></p>
    </div>
  </footer>
  <button type="button" class="back-to-top" id="backToTop" hidden aria-label="Voltar ao topo"></button>
  <script src="js/storage.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
